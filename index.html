<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المعرفة الذكية - Smart Knowledge</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: #0b0f19;
            color: #ffffff;
        }

        /* تصميم الخلفية الفخمة التي تحمل الشعار والعبارة */
        .hero-background {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(rgba(11, 15, 25, 0.85), rgba(11, 15, 25, 0.95)),
                        url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?q=80&w=1920&auto=format&fit=crop') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px 20px;
            text-align: center;
        }

        /* رأس الصفحة والشعار */
        .header-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }

        .logo-container {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #d4af37;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.6);
            margin-bottom: 15px;
            overflow: hidden;
        }

        .logo-container img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }

        h1 {
            font-size: 28px;
            color: #f3e5ab;
            font-weight: 700;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-size: 14px;
            letter-spacing: 2px;
            color: #d4af37;
            margin-bottom: 20px;
        }

        /* الأزرار والروابط السريعة داخل الواجهة */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 400px;
            margin: 20px 0;
        }

        .nav-card {
            background: rgba(20, 25, 40, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            padding: 20px 15px;
            color: #ffffff;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .nav-card:hover {
            border-color: #d4af37;
            transform: translateY(-3px);
            background: rgba(30, 38, 60, 0.9);
        }

        .nav-card h3 {
            font-size: 15px;
            color: #f3e5ab;
        }

        /* العبارة الشعرية في أسفل الخلفية */
        .footer-poetry {
            margin-bottom: 20px;
            padding: 15px;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            width: 100%;
            max-width: 500px;
        }

        .footer-poetry p {
            font-size: 15px;
            color: #e0e0e0;
            line-height: 1.6;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .footer-poetry span {
            color: #ff4d4d;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="hero-background">
        <!-- الشعار واسم المنصة -->
        <div class="header-section">
            <div class="logo-container">
                <img src="library-app/icons/library-logo.png" alt="شعار المعرفة الذكية">
            </div>
            <h1>المعرفة الذكية</h1>
            <div class="subtitle">SMART KNOWLEDGE</div>
        </div>

        <!-- الأقسام والخيارات -->
        <div class="nav-grid">
            <a href="#" class="nav-card">
                <h3>📚 المناهج الدراسية اليمنية</h3>
            </a>
            <a href="#" class="nav-card">
                <h3>📖 الكتب العامة</h3>
            </a>
            <a href="#" class="nav-card">
                <h3>🤖 البطاقات الذكية</h3>
            </a>
            <a href="#" class="nav-card">
                <h3>📂 المستندات</h3>
            </a>
            <!-- الإضافة الوحيدة: رابط تطبيق المكتبة المستقل -->
            <a href="library-app/index.html" class="nav-card" aria-label="فتح تطبيق مكتبة المعرفة الذكية">
                <h3>📱 تطبيق المكتبة</h3>
            </a>
        </div>

        <!-- الشعار النصي في الخلفية -->
        <div class="footer-poetry">
            <p>من هنا تبدأ المعرفة ...<br>ومن المعرفة <span>ينطلق المستقبل.</span></p>
        </div>
    </div>

</body>
</html>
