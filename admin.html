<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">

<title>دخول المدير | المعرفة الذكية</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(145deg,#050505,#190e29);
  color: white;
}

.container {
  width: 100%;
  max-width: 450px;
  padding: 28px 22px;
  background: #100e15;
  border: 1px solid #9b75ce;
  border-radius: 22px;
  box-shadow: 0 0 30px #853cff30;
}

.logo {
  text-align: center;
  font-size: 48px;
}

h1 {
  text-align: center;
  color: #e8c36c;
  font-size: 25px;
}

.subtitle {
  text-align: center;
  color: #aaa;
  margin-bottom: 25px;
  font-size: 14px;
}

.badge {
  text-align: center;
  color: #cba6ff;
  margin-bottom: 22px;
}

label {
  display: block;
  color: #e8c36c;
  margin: 15px 0 8px;
}

input {
  width: 100%;
  padding: 14px;
  background: #1b1822;
  border: 1px solid #514365;
  border-radius: 10px;
  color: white;
  font-size: 15px;
}

button {
  cursor: pointer;
}

.primary {
  width: 100%;
  padding: 14px;
  margin-top: 20px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(90deg,#a77a20,#f0d17b);
  color: #111;
  font-weight: bold;
  font-size: 16px;
}

.scan {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: 1px solid #9868d8;
  border-radius: 10px;
  background: #21152e;
  color: #e3caff;
  font-size: 15px;
}

.scan:hover {
  background: #352044;
}

#camera {
  width: 100%;
  display: none;
  margin-top: 15px;
  border-radius: 12px;
  overflow: hidden;
}

video {
  width: 100%;
  border-radius: 12px;
}

.message {
  display: none;
  padding: 12px;
  margin-top: 15px;
  border-radius: 9px;
  text-align: center;
  font-size: 14px;
}

.error {
  display: block;
  background: #501818;
  color: #ffb0b0;
}

.success {
  display: block;
  background: #173e26;
  color: #a9f2ba;
}

button:disabled {
  opacity: .6;
}

.back {
  display: block;
  text-align: center;
  color: #d9c5ff;
  margin-top: 22px;
  text-decoration: none;
}

.footer {
  text-align: center;
  color: #777;
  font-size: 12px;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">👑</div>

  <h1>المعرفة الذكية</h1>

  <div class="subtitle">
    منصة إدارة المعرفة الذكية
  </div>

  <div class="badge">
    🔐 منطقة دخول المدير
  </div>

  <form id="loginForm">

    <label for="email">البريد الإلكتروني</label>

    <input
      type="email"
      id="email"
      placeholder="البريد الإلكتروني للمدير"
      autocomplete="username"
      required
    >

    <label for="password">كلمة المرور</label>

    <input
      type="password"
      id="password"
      placeholder="كلمة مرور المدير"
      autocomplete="current-password"
      required
    >

    <button type="submit" class="primary" id="loginBtn">
      تسجيل دخول المدير
    </button>

  </form>

  <hr style="border-color:#382b49;margin:25px 0">

  <div style="text-align:center;color:#e8c36c">
    أو الدخول باستخدام بطاقة المدير
  </div>

  <button class="scan" id="qrBtn" type="button">
    📷 مسح بطاقة المدير QR
  </button>

  <div id="camera">
    <video id="video" autoplay playsinline></video>
    <button class="scan" id="stopBtn" type="button">
      إيقاف الكاميرا
    </button>
  </div>

  <button class="scan" id="nfcBtn" type="button">
    📡 قراءة بطاقة المدير NFC
  </button>

  <div id="message" class="message"
       role="status" aria-live="polite"></div>

  <a href="index.html" class="back">
    العودة إلى الصفحة الرئيسية
  </a>

  <div class="footer">
    © Smart Knowledge
  </div>

</div>

<script>

// رابط الخادم
const API_BASE_URL = "https://YOUR-SERVER.onrender.com";

const message = document.getElementById("message");

function showMessage(text,type) {
  message.textContent = text;
  message.className = "message " + type;
}

async function managerLogin(email,password) {

  const response = await fetch(
    API_BASE_URL + "/api/auth/login",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({email,password})
    }
  );

  const data = await response.json();

  if (!response.ok) {
    throw new Error(data.message || "فشل تسجيل الدخول");
  }

  if (!data.user || data.user.role !== "manager") {
    throw new Error("هذا الحساب ليس حساب مدير");
  }

  if (!data.token) {
    throw new Error("تعذر إنشاء جلسة الدخول");
  }

  sessionStorage.setItem("managerToken",data.token);

  window.location.href = "admin-dashboard.html";
}

// تسجيل الدخول بالبريد وكلمة المرور
document.getElementById("loginForm")
.addEventListener("submit",async function(e) {

  e.preventDefault();

  const btn = document.getElementById("loginBtn");

  btn.disabled = true;

  try {

    await managerLogin(
      document.getElementById("email").value.trim(),
      document.getElementById("password").value
    );

  } catch(error) {

    showMessage(error.message,"error");

  } finally {

    btn.disabled = false;

  }

});

// مسح QR
let cameraStream = null;
let scanning = false;

document.getElementById("qrBtn")
.addEventListener("click",async function() {

  if (!("BarcodeDetector" in window)) {
    showMessage(
      "متصفحك لا يدعم قراءة QR مباشرة. استخدم متصفحاً يدعم BarcodeDetector.",
      "error"
    );
    return;
  }

  try {

    const detector = new BarcodeDetector({
      formats: ["qr_code"]
    });

    cameraStream = await navigator.mediaDevices
      .getUserMedia({
        video: { facingMode: "environment" }
      });

    const video = document.getElementById("video");

    video.srcObject = cameraStream;

    document.getElementById("camera").style.display = "block";

    scanning = true;

    async function scanFrame() {

      if (!scanning) return;

      try {

        const codes = await detector.detect(video);

        if (codes.length) {

          scanning = false;

          stopCamera();

          await verifyCard(codes[0].rawValue);

          return;

        }

      } catch(error) {
        console.error("QR scan error");
      }

      if (scanning) {
        requestAnimationFrame(scanFrame);
      }

    }

    video.onloadedmetadata = () => {
      video.play();
      scanFrame();
    };

  } catch(error) {

    showMessage(
      "تعذر فتح الكاميرا. تحقق من إذن الكاميرا.",
      "error"
    );

  }

});

function stopCamera() {

  scanning = false;

  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
    cameraStream = null;
  }

  document.getElementById("camera").style.display = "none";

}

document.getElementById("stopBtn")
.addEventListener("click",stopCamera);

// التحقق من البطاقة عبر الخادم
async function verifyCard(cardCode) {

  try {

    showMessage("جارٍ التحقق من البطاقة...","success");

    const response = await fetch(
      API_BASE_URL + "/api/admin/card-login",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({cardCode})
      }
    );

    const data = await response.json();

    if (!response.ok || !data.token) {
      throw new Error(data.message || "البطاقة غير صالحة");
    }

    sessionStorage.setItem("managerToken",data.token);

    window.location.href = "admin-dashboard.html";

  } catch(error) {

    showMessage(error.message,"error");

  }

}

// قراءة NFC
document.getElementById("nfcBtn")
.addEventListener("click",async function() {

  if (!("NDEFReader" in window)) {

    showMessage(
      "الهاتف أو المتصفح لا يدعم قراءة NFC عبر هذه الصفحة.",
      "error"
    );

    return;
  }

  try {

    const reader = new NDEFReader();

    await reader.scan();

    showMessage(
      "قرّب بطاقة المدير من الهاتف...",
      "success"
    );

    reader.onreading = async event => {

      let cardCode = null;

      for (const record of event.message.records) {

        if (record.recordType === "text") {

          const decoder = new TextDecoder(
            record.encoding || "utf-8"
          );

          cardCode = decoder.decode(record.data);

          break;

        }

      }

      if (cardCode) {

        await verifyCard(cardCode);

      } else {

        showMessage(
          "لم يتم العثور على رمز صالح في البطاقة",
          "error"
        );

      }

    };

  } catch(error) {

    showMessage(
      "تعذر قراءة NFC. تحقق من دعم الهاتف وإذن المتصفح.",
      "error"
    );

  }

});

</script>

</body>
</html>
